apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      containers:
        - name: veracity-transparency-sidecar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: VERACITY_TRANSPARENCY_BACKEND
              value: "{{ .Values.sidecar.backend }}"
            - name: VERACITY_QUEUE_PATH
              value: "{{ .Values.sidecar.queuePath }}"
            - name: VERACITY_RECEIPT_PATH
              value: "{{ .Values.sidecar.receiptPath }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
