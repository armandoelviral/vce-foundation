[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sp001-retail-reference"
version = "0.1.0"
description = "Retail reference implementation for the VCE Scientific Product Factory"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.2",
]

[project.optional-dependencies]
browser = ["playwright==1.64.1"]
auth = [
    "PyJWT[crypto]==2.15.1",
]
host = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest>=9.0",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

